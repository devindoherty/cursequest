- dialogue: awakened_where 
  choice: String::from("Where am I?"),
  response: You are in the Shir Valley, in the village of Finn's Glenn.
  children: 
    - awakened_village
    - awakened_village_lore
    - awakened_village_customs
  
- dialogue: awakened_village
  choice: This is a halfling village?
  response: > 
    It is. We are a humble folk, the Hobs of the Shir Valley. What 
    some might say we lack in stature, we make up for in a myriad 
    of other ways. I hope you remember our hospitality in the days ahead.
  children: 
    - awakened_alt_root

- dialogue: awakened_village_lore
  choice: I know of this place, and your people. [LORE 1]
  skillcheck:
    - skill: Lore
    - check: 1
  response: >
    The halflings, or Hobs, of Shir Valley are an ancient people, said to be 
    related to faeries, known to be brave and loyal. Roseberry seems surprised.
    "You know the stories of my people? I am glad. Few men or dwarves, nor even 
    elves venture here. Fewer still since the death of the last king."
  children: 
    - awakened_alt_root
        
