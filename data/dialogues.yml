  choice: King Kull is dead, then?
  response: >
    The little woman sighs and pats your shoulder. "It is said he died within 
    the dungeons of the Uncrowned King." You let the truth sink in: Your father 
    is dead. [JOURNAL UPDATED]
  flag_names: learned_father_death
  children:
    - awakened_alt_root


