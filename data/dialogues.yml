- dialogue: awakened_root 
  choice: Let us speak of other things.
  response: >
    You awaken in a small, rustic home. The woman seated beside you is perhaps three 
    feet tall at most. She looks relieved when you open your eyes. "You have stirred. 
    Good. You were half dead when we found you. Rest now. You are safe."
  children: awakened_where

- dialogue: awakened_alt_root
