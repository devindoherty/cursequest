---
# items:
################
# Cursed Blade #
################
- dialogue: blade_intro_root
  choice: ROOT
  response: >
    Only dark. And then a voice: "Oh, lost princeling. You could not resist a sword
    from the stone, could you? There is no more surefire a way to prove your royal
    stripes."
  children:
    - blade_intro_root_cont

- dialogue: blade_intro_root_cont
  choice: Continue...
  response: >
    The voice chuckles, a sharp, malicious noise. "Princeling mine, are you aware of
    the price to pay for your kingdom? And are you willing?"
  children:
    - blade_intro_price_blood
    - blade_intro_price_coin
    - blade_intro_price_soul
    - blade_intro_price_kinship
    - blade_intro_price_refuse

- dialogue: blade_intro_price_blood
  choice: There will be a blood price.
  response: >
    "Yes, yes!" the eager voice shouts. "The road to your throne is drenched in lifeblood.
    Take it liberally and with wanton violence!"
  children:
    - blade_intro_deal

- dialogue: blade_intro_price_coin
  choice: I will find the coin to pay.
  response: >
    "How trivial. Men and their money. Yet again, I have seen the debasements of merchants."
    The voice considers for a moment, "Incentivize darkness with coin and the blade will
    beckon."
  children:
    - blade_intro_deal

- dialogue: blade_intro_price_soul
  choice: My own soul, if I must.
  response: >
    A low growl fills the dark. The voice sounds positively ravenous. "Indeed? For what 
    is a king who has a retained a soul, but lost a kingdom?"
  children:
    - blade_intro_deal

- dialogue: blade_intro_price_kinship
  choice: Friends and family, forsaking all kinship.
  response: >
    The voice is giddy. "You would sacrifice them all, truly? Wonderful. 
    Simply wonderful."
  children:
    - blade_intro_deal

- dialogue: blade_intro_price_refuse
  choice: There will be no bargaining for dark power.
  response: >
    The voice tsks. "Careful, princeling. You know not what you refuse. You shall come
    around, in time."
  children:
    - blade_intro_deal

- dialogue: blade_intro_deal
  choice: And what do you offer in return?
  response: >
    A cold silence pierces the darkness. "The powers I offer you are immense. But they 
    come at the price you have told me you are willing to pay. I shall remain magnanimous. 
    Your debts are deferred, for the moment." The voice pauses. Light creeps into 
    your vision. "Remember, princeling, the $pc_price." Then nothing but blinding light.
  children:
    - blade_intro_end

- dialogue: blade_intro_end
  choice: Continue...
  response: END
  children:
    - END
#############
# Roseberry #
#############
- dialogue: awakened_root
  choice: ROOT
  response: >
    You awaken in a small, rustic home. The woman seated beside you is perhaps three 
    feet tall at most. She looks relieved when you open your eyes. "You have stirred. 
    Good. You were half dead when we found you. Rest now. You are safe."
  children:
    - awakened_where
    - awakened_identity

- dialogue: awakened_alt_root
  choice: Let us speak of other things.
  response: Roseberry tends to your wounds quietly.
  children: 
    - awakened_where
    - awakened_identity

- dialogue: awakened_where 
  choice: Where am I?
  response: "You are in the Shir Valley, in the village of Finn's Glenn."
  children: 
    - awakened_village
    - awakened_village_lore
    - awakened_village_customs
  
- dialogue: awakened_village
  choice: This is a halfling village?
  response: > 
    "It is. We are a humble folk, the Hobs of the Shir Valley. What 
    some might say we lack in stature, we make up for in a myriad 
    of other ways. I hope you remember our hospitality in the days ahead."
  children: 
    - awakened_alt_root

- dialogue: awakened_village_lore
  choice: I know of this place, and your people. [LORE 1]
  # skillcheck:
  #   - skill: Lore
  #   - check: 1
  response: >
    The hobs of Shir Valley are an ancient people, said to be related to faeries, 
    known to be brave and loyal. Roseberry seems surprised.
    "You know the stories of my people? I am glad. Few men or dwarves, nor even 
    elves venture here. Fewer still since the death of the last king."
  children: 
    - awakened_old_king
    - awakened_alt_root

- dialogue: awakened_old_king
  choice: King Kull is dead, then?
  response: >
    The little woman sighs and pats your shoulder. "It is said he died within 
    the dungeons of the Uncrowned King." You let the truth sink in: Your father 
    is dead. [JOURNAL UPDATED]
  # flag_names: learned_father_death
  children:
    - awakened_alt_root

- dialogue: awakened_hospitality
  choice: As you have offered your home to me, mine is open to you. [CUSTOMS 1]
  response: >
    "That is kind of you, but I fear we may find your halls less than hospitable, 
    at the moment."
  # skillcheck:
  #   - skill: Customs
  #   - check: 1
  children:
    - awakened_alt_root

- dialogue: awakened_identity
  choice: Who are you?
  response: >
   "Why, I'm Roseberry, the village's apothecary. This is my humble home."
   She smiles at you. "Be welcome."
  children:
    - awakened_king_identity_truth
    - awakened_king_identity_lie

- dialogue: awakened_king_identity_truth
  choice: Well met, Roseberry. I am Kryll, the rightful king of Klathia.
  response: >
    Roseberry smiles, although her face is beset with sadness. She bows her head. 
    "I know. I recognize your face, my king. Were that these less grim times, the 
    people of Finn's Glenn would honor your return with celebration."  
  # flags: king_identity_told_truth
  children:
    - awakened_alt_root

- dialogue: awakened_king_identity_lie
  choice: Greetings, Roseberry. I am merely a passerby of little renown.
  response: >
    Roseberry smiles strangely but nods, "But of course. You are welcome all 
    the same."
  # link: RemoveSiblings
  children:
    - awakened_alt_root

- dialogue: awakened_happened
  choice: What happened?
  response: "A group of hunters from my village found you collapsed in the wilderness. You were holding that.\" She points to an ancient blade among your belongings. \"I had you brought here and have nursed you back to health.\" You hear a faint whispering from the blade, as if it... calls to you."
  # flag_names: None,
  children: 
    - awakened_blade_whispers
    - awakened_blade_sword
    - awakened_blade_sorcery
    - awakened_blade_martial
    - awakened_blade_regality
    - awakened_blade_lore

- dialogue: awakened_blade_investigate
  choice: Investigate the blade further.
  response: Whispers fill the air. The blade calls to you. Roseberry shivers.
  children: 
    - awakened_blade_whispers
    - awakened_blade_sword
    - awakened_blade_sorcery
    - awakened_blade_martial
    - awakened_blade_regality
    - awakened_blade_lore
    - awakened_alt_root

- dialogue: awakened_blade_whispers
  choice: I can... hear the blade.
  response: >
    "It is cursed," Roseberry says plainly. "And now, as its wielder, so are you."
  children: 
    - awakened_blade_investigate

- dialogue: awakened_blade_sword
  choice: Grab the blade and flourish it skillfully. [SWORD 1]
  response: >
    The blade seems to almost slice the air itself. Roseberry purses her 
    lips thoughtfully. "You could cut through a dozen armed and armored 
    men with such a weapon as easily as I carve a cake."
  # skillcheck:
  #   - skill: Sword
  #   - check: 1
  children:
    - awakened_blade_investigate

- dialogue: awakened_blade_sorcery
  choice: Hover your hand over the blade, reaching for the magic within. [SORCERY 1]
  response: >
    The blade radiates waves of vile black magic. Roseberry frowns, "You sense 
    it too. It is as I feared. This sword is cursed."
  # skillcheck:
  #   - skill: Sorcery
  #   - check: 1
  children:
    - awakened_blade_investigate 

- dialogue: awakened_blade_martial
  choice: Listen to the blade's whispers. [MARTIAL 1]
  response: >
    A faint voice eminates from the blade. It speaks of bloody combat. 
    Of men marching into glorious battle. "Those who wield me are all but invincible..." 
    it whispers to you. Roseberry looks from the blade to you and mutters, "It is a 
    cursed blade. Listen to it at your own peril."
  # skillcheck:
  #   - skill: Martial
  #   - check: 1
  children:
    - awakened_blade_investigate

- dialogue: awakened_blade_regality
  choice: Envision a kingdom won through the might of this blade. [REGALITY 1]
  response: >
    "The cost of thy kingdom can be tolled in blood..." the sword whispers to you. 
    Roseberry shakes her head. "Be weary of such a price to pay," she warns.
  # skillcheck:
  #   - skill: Regality
  #   - check: 1
  children: 
    - awakened_blade_investigate

- dialogue: awakened_blade_lore
  choice: Study the blade. [LORE 1]
  response: >
    You have read of such swords. They are forged or enchanted with malevolent 
    spirits. The tales often do not end kindly for the wielders of such weapons. 
    Roseberry says, "And for good reason. The blade is evil."
  # skillcheck:
  #   - skill: Lore
  #   - check: 1      
  children:
    - awakened_blade_lore

- dialogue: awakened_attack
  choice: Die, witch! [ATTACK]
  response: > 
    Roseberry's lips quiver in shock. "Is this truly what I am owed for saving your 
    life?" Grabbing the cursed blade, you strike her down with all your might. The 
    sword laughs maliciously.
  children:
    - awakened_end 
  
- dialogue: awakened_farewell
  choice: Farewell. [END CONVERSATION]
  response: "Before you depart, may I ask a boon of you?"
  children:
    - awakened_quest_yes
    - awakened_quest_no

- dialogue: awakened_quest_no
  choice: No.
  response: >
   The small woman who nursed you back to health looks taken aback but then nods. 
   "If you feel you are ready to embark, I will not stop you. But know this: The 
   Shir Valley is relatively safe, yet the realm beyond is dangerous. The Uncrowned 
   King holds court upon the throne. His armies are vast, and his sorceries vile..."
  children: 
    - awakened_no_continued

- dialogue: awakened_quest_no_continued
  choice: Continue...
  response: >
    "The elven queen hides in her forest realm and the dwarven king cowers 
    in his mountain hall. The Klathian dukes and lords have all bent the knee. 
    Any who would openly defy him, especially one as weak as you, would be 
    doomed to fail."
  children:
    - awakened_end

- dialogue: awakened_quest_yes
  choice: Yes.
  response: >
    "Several of the hunters who rescued have since gone missing near the same 
    place they found you. If you could find it in your heart to look for them, 
    their families would be much relieved to have an experienced adventurer on 
    the search," Roseberry explains.
  children:
    - awakened_end 

- dialogue: awakened_end
  choice: Continue...
  response: END
  children:
    - END

##################
# Uncrowned King #
##################
- dialogue: uncrowned_root
  choice: ROOT
  response: >
    "I know your face. You're Kryll, they call you the trueborn King of Klathia." The
    Uncrowned King's smile falters. "So, have you finally come to claim your throne?"
  children:
    - uncrowned_might
    - uncrowned_dogooder
    - uncrowned_reject
    - uncrowned_return
        
- dialogue: uncrowned_might
  choice: I have come to claim what is mine, by right.
  response: PLACEHOLDER
  children:
    - PLACEHOLDER 
        
- dialogue: uncrowned_dogooder
  choice: I have come to rid the kingdom of your evil.
  response: PLACEHOLDER
  children: 
    - PLACEHOLDER

- dialogue: uncrowned_reject      
  choice: You can keep the throne.
  response: PLACEHOLDER
  children: 
    - PLACEHOLDER
  
- dialogue: uncrowned_return
  choice: I've come to return your blade.
  response: PLACEHOLDER
  children: 
    - PLACEHOLDER